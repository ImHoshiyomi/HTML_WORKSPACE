<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const today = new Date();
      const home = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate(),
        18,
        20
      );

      function getDiff(targetTime, currentTime) {
        return Math.abs(targetTime - currentTime);
      }

      setInterval(() => {
        const diff = getDiff(home, new Date());

        const hours = Math.floor(diff / (60 * 60 * 1000));
        const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
        const seconds = Math.floor((diff % (60 * 1000)) / 1000);

        document.getElementById(
          "timer"
        ).innerText = `${hours}시간 ${minutes}분 ${seconds}초`;
      });
    </script>
  </head>
  <body>
    <h2>탈출까지 남은 시간: <span id="timer"></span></h2>
  </body>
</html>
