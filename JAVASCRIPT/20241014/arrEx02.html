<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const myArray = new Array();

      // const myArray = [];

      for (let i = 0; i < 10; i++) {
        myArray[i] = i;
      }

      document.writeln(`<h1>배열의 길이 ${myArray.length}</h1>`);

      for (let i = 0; i < myArray.length; i++) {
        document.writeln(`<h3>${myArray[i]}</h3>`);
      }
    </script>
  </head>
  <body></body>
</html>
