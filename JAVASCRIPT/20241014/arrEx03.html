<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const arr = [
        ["홍길동", "활빈당", "보스"],
        ["강감찬", "귀주대첩", "고려의 장군"],
      ];

      for (let i = 0; i < arr.length; i++) {
        for (let j = 0; j < arr[i].length; j++) {
          document.writeln(`<h2>${arr[i][j]}</h2>`);
        }
      }
    </script>
  </head>
  <body></body>
</html>
