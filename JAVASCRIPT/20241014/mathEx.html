<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const max = Math.max(100, 123);
      document.writeln(`<h1>최대값: ${max}</h1>`);

      const min = Math.min(100, 123);
      document.writeln(`<h1>최소값: ${min}</h1>`);

      const pi = Math.PI;
      document.writeln(`<h1>원주율: ${pi}</h1>`);

      const num1 = 3.7146;
      const round = Math.round(num1);
      document.writeln(`<h1>${num1}을 반올림한 수: ${round}</h1>`);

      const ceil = Math.ceil(num1);
      const floor = Math.floor(num1);
      document.writeln(`<h1>${num1}을 올림한 수: ${ceil}</h1>`);
      document.writeln(`<h1>${num1}을 내림한 수: ${floor}</h1>`);

      const num2 = -123;
      const abs = Math.abs(num2);
      document.writeln(`<h1>${num2}의 절대값: ${abs}</h1>`);

      const random = Math.random();
      document.writeln(`난수: ${random}</h1>`);
    </script>
  </head>
  <body></body>
</html>
