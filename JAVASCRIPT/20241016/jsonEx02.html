<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function initCompany() {
        const company = {
          name: "(주)글로벌인",
          since: 2024,
          department: ["기획팀", "영업팀", "디자인팀", "개발팀"],
          business: ["소프트웨어 개발", "통신판매업", "위치정보서비스"],
        };

        document.getElementById("name").innerText = company.name;

        document.getElementById("since").innerText = company.since;

        let departments = "";

        for (let i = 0; i < company.department.length; i++) {
          departments += `<li>${company.department[i]}</li>`;
        }
        document.getElementById("department").innerHTML = departments;

        let businesses = "";

        for (let i = 0; i < company.business.length; i++) {
          businesses += `<li>${company.business[i]}</li>`;
        }
        document.getElementById("business").innerHTML = businesses;
      }
    </script>
  </head>
  <body onload="initCompany()">
    <h1 id="name"></h1>
    <p><strong>설립 년도: </strong><span id="since"></span></p>
    <h1>주요 사업 부서</h1>
    <ul id="department"></ul>
    <h2>주요 사업 분야</h2>
    <ul id="business"></ul>
  </body>
</html>
