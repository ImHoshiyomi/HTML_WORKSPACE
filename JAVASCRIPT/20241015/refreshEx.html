<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // 두 수 사이의 난수를 리턴하는 함수

      // 5자리 인증번호를 id값이 "auth"인 요소에 출력

      // 페이지 새로고침

      function getRandomNumber(start, end) {
        return parseInt(Math.random() * (end - start + 1) + start);
      }

      function getRandomCode(length) {
        let code = "";

        for (let i = 0; i < length; i++) {
          code += getRandomNumber(0, 9);
        }

        return code;
      }

      function printCode(id) {
        const code = getRandomCode(5);

        document.getElementById(id).innerText = code;
      }

      function refresh() {
        location.reload();
      }
    </script>
  </head>
  <body onload="printCode('auth')">
    <p>
      고객님의 인증번호는
      <strong id="auth">00000</strong>입니다.
    </p>
    <input type="button" value="인증번호 새로 받기" onclick="refresh()" />
  </body>
</html>
