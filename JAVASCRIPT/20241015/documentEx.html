<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box1 {
        margin: 10px auto;
        border: 5px solid #ccc;
        padding: 30px;
        text-align: center;
      }

      .box2 {
        margin: 10px auto;
        border: 10px solid #ff00ff;
        background-color: #ff0;
        padding: 25px;
        text-align: left;
      }
    </style>
    <script>
      function setFontColor(color) {
        const box = document.getElementById("box");

        box.style.color = color;
      }
      function setBGColor(color) {
        const box = document.getElementById("box");

        box.style.backgroundColor = color;
      }
      function setWidth(width) {
        const box = document.getElementById("box");

        box.style.width = width;
      }
      function setClass(className) {
        const box = document.getElementById("box");

        box.className = className;
      }

      function getRandomHex() {
        const decimal = parseInt(Math.random() * 256);

        const hexString = decimal.toString(16);

        return hexString;
      }
      setInterval(() => {
        const hexCode = "#" + getRandomHex() + getRandomHex() + getRandomHex();

        const css = document.getElementById("box");

        css.style.borderColor = hexCode;
      }, 10);
    </script>
  </head>
  <body>
    <h1 id="CSS">CSS 제어</h1>
    <div id="box" class="box1"><h1>출력 영역</h1></div>
    <input type="button" value="(폰트) red" onclick="setFontColor('#f00')" />
    <input type="button" value="(폰트) green" onclick="setFontColor('#0f0')" />
    <input type="button" value="(폰트) blue" onclick="setFontColor('#00f')" />
    <br />
    <input type="button" value="(배경) red" onclick="setBGColor('#f00')" />
    <input type="button" value="(배경) green" onclick="setBGColor('#0f0')" />
    <input type="button" value="(배경) blue" onclick="setBGColor('#00f')" />
    <br />
    <input type="button" value="width=50%" onclick="setWidth('50%')" />
    <input type="button" value="width=auto" onclick="setWidth('auto')" />
    <br />
    <input type="button" value="class=box1" onclick="setClass('box1')" />
    <input type="button" value="class=box2" onclick="setClass('box2')" />
  </body>
</html>
