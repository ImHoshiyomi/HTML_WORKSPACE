<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .thumbnail {
        padding: 0;
        margin: 0;
        list-style: none;
        width: 120px;
        float: left;
      }

      .thumbnail li {
        width: 100px;
        height: 100px;
        padding: 5px 10px;
      }

      .thumbnail img {
        width: 100px;
        height: 100px;
      }

      .view {
        float: left;
        width: 500px;
        height: 320px;
        padding: 5px 0;
      }

      .view img {
        width: 500px;
        height: 320px;
      }
    </style>
    <script>
      function setImage(index) {
        const imageList = ["img/1.jpg", "img/2.jpg", "img/3.jpg"];

        const image = document.getElementById("target");

        image.src = imageList[index];
      }
    </script>
  </head>
  <body>
    <ul class="thumbnail">
      <li>
        <a href="#" onclick="setImage(0)"><img src="img/1.jpg" /></a>
      </li>
      <li>
        <a href="#" onclick="setImage(1)"><img src="img/2.jpg" /></a>
      </li>
      <li>
        <a href="#" onclick="setImage(2)"><img src="img/3.jpg" /></a>
      </li>
    </ul>
    <div class="view">
      <img src="img/1.jpg" id="target" />
    </div>
  </body>
</html>
