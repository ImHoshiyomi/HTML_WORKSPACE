<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const url = "http://WWW.ITPAPER.CO.KR/index.jsp";
      document.writeln(`<h1>${url}</h1>`);

      const len = url.length;
      document.writeln(`<h1>${len}</h1>`);

      const cha = url.charAt(2);
      document.writeln(`<h1>${cha}</h1>`);

      const sla = url.indexOf("/");
      document.writeln(`<h1>${sla}</h1>`);
    </script>
  </head>
  <body></body>
</html>
